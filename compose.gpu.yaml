services:
  agent:
    image: vllm/vllm-openai:v0.28.0
    container_name: customer-intelligence-agent
    restart: unless-stopped
    ipc: host
    gpus: all
    volumes:
      - /opt/customer-intelligence/model-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command:
      - --model
      - openai/gpt-oss-20b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.50"
      - --max-num-seqs
      - "2"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - openai
      - --reasoning-parser
      - openai_gptoss

  structured:
    image: vllm/vllm-openai:v0.28.0
    container_name: customer-intelligence-structured
    restart: unless-stopped
    ipc: host
    gpus: all
    volumes:
      - /opt/customer-intelligence/model-cache:/root/.cache/huggingface
    ports:
      - "8002:8000"
    command:
      - --model
      - Qwen/Qwen3-8B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.35"
      - --max-num-seqs
      - "2"
      - --dtype
      - bfloat16

  reranker:
    build:
      context: .
      dockerfile: backend/Dockerfile.reranker
    image: customer-intelligence-reranker:latest
    container_name: customer-intelligence-bge-m3
    restart: unless-stopped
    ipc: host
    gpus: all
    volumes:
      - /opt/customer-intelligence/model-cache:/root/.cache/huggingface
    environment:
      RAG_RERANKER_MODEL: BAAI/bge-m3
      RAG_RERANKER_DEVICE: cuda
      RAG_RERANKER_BATCH_SIZE: "2"
      RAG_RERANKER_QUERY_MAX_TOKENS: "256"
      RAG_RERANKER_PASSAGE_MAX_TOKENS: "2048"
    ports:
      - "8003:8000"
