services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      RAG_RERANKER_ENABLED: "${RAG_RERANKER_ENABLED:-false}"
      RAG_RERANKER_BASE_URL: "${RAG_RERANKER_BASE_URL:-}"
      RAG_RERANKER_TIMEOUT_SECONDS: "${RAG_RERANKER_TIMEOUT_SECONDS:-60}"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # 단일 vLLM 확인용 profile. 전체 로컬 GPU 구성은 local-gpu.yaml을 사용한다.
  vllm:
    image: vllm/vllm-openai:v0.28.0
    profiles: ["gpu"]
    command:
      - "--model"
      - "${VLLM_AGENT_MODEL:-openai/gpt-oss-20b}"
      - "--max-model-len"
      - "16384"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "openai"
      - "--reasoning-parser"
      - "openai_gptoss"
      - "--gpu-memory-utilization"
      - "0.50"
    ports:
      - "127.0.0.1:8001:8000"
